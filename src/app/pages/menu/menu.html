<section id="carta" class="menu-page py-5">
  <div class="container">

    <!-- Encabezado -->
    <div class="row mb-5">
      <div class="col-12 text-center">
        <div class="menu-intro">
          <h2 class="text-warning mb-2">NUESTRA CARTA</h2>
          <div class="menu-divider"></div>
          <p class="text-white-50 mb-0 mt-3">Sabores de Fondo de Bikini para todos los gustos.</p>
        </div>
      </div>
    </div>
    @for (category of menuService.categories(); track category.id) {
      <div class="menu-category mb-5">
        <h3 class="text-warning mb-4"><span class="me-2">{{ category.icon }}</span>{{ category.title }}</h3>
        <div class="row g-4">
          @for (item of category.items; track item.id) {
            <div class="col-md-6 col-lg-3">
              <app-menu-item-card [item]="item"></app-menu-item-card>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
